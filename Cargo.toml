[package]
name = "yarik-games"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["wgame/desktop", "wgame-egui/desktop"]
web = ["wgame/web", "wgame-egui/web"]

[dependencies]
phy = { path = "phy" }
geom2 = { path = "geom2" }
wgame-egui = { path = "wgame/wgame-egui", default-features = false }
wgame = { path = "wgame/wgame", default-features = false, features = ["shapes", "image", "typography"] }
rand = { version = "0.10.2", default-features = false, features = ["alloc"] }
rand_distr = { version = "0.6.0", default-features = false }
euclid = "0.22.14"

web-time = "1.1.0"

[dev-dependencies]
wgpu = { version = "30.0.1", default-features = false }
futures = { version = "0.3.34", features = ["executor"] }
