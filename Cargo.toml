[package]
name = "yarik-games"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["wgame/desktop"]
web = ["wgame/web"]

[dependencies]
wgame = { path = "wgame/wgame", default-features = false, features = ["shapes", "image", "typography"] }
rand = { version = "0.9.2", default-features = false, features = ["alloc", "small_rng"] }
rand_distr = { version = "0.5.1", default-features = false }
euclid = "0.22.11"

web-time = "1.1.0"

[dev-dependencies]
wgpu = { version = "30.0.1", default-features = false }
futures = { version = "0.3.34", features = ["executor"] }
