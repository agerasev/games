[package]
name = "run"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["wgame/desktop"]
web = ["wgame/web"]

[dependencies]
wgame = { path = "wgame/wgame", default-features = false, features = ["shapes", "image"] }
rand = { version = "0.9.2", default-features = false, features = ["alloc", "small_rng"] }
rand_distr = { version = "0.5.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.100"
