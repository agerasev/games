[package]
name = "run"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["wgame/desktop"]
web = ["wgame/web"]

[dependencies]
wgame = { path = "wgame/wgame", default-features = false, features = ["shapes", "image"] }
rand = { version = "0.10.2", default-features = false, features = ["alloc"] }
rand_distr = { version = "0.6.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
